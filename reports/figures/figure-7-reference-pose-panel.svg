<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="100%" height="100%" fill="#fff"/><text x="45" y="55" style="font:700 27px Arial;fill:#172033">Reference-pose recovery under frozen Vina configurations</text><text x="45" y="87" style="font:15px Arial;fill:#172033">Nine retained poses per case; top-score and lowest-RMSD rules are reported separately.</text><rect x="70" y="135" width="435" height="300" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="94" y="180" style="font:700 23px Arial;fill:#172033">BRAF 3D4Q / SM5</text><text x="94" y="230" style="font:16px Arial;fill:#334155">Top-score value</text><text x="94" y="270" style="font:700 30px Arial;fill:#172033">-10.929 kcal/mol</text><text x="94" y="325" style="font:16px Arial;fill:#334155">RMSD of top-score pose</text><text x="94" y="360" style="font:700 28px Arial;fill:#172033">1.134 Å</text><text x="312" y="325" style="font:16px Arial;fill:#334155">Lowest RMSD</text><text x="312" y="360" style="font:700 28px Arial;fill:#172033">1.083 Å</text><rect x="595" y="135" width="435" height="300" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="619" y="180" style="font:700 23px Arial;fill:#172033">KIF11 3CJO / K30</text><text x="619" y="230" style="font:16px Arial;fill:#334155">Top-score value</text><text x="619" y="270" style="font:700 30px Arial;fill:#172033">-10.994 kcal/mol</text><text x="619" y="325" style="font:16px Arial;fill:#334155">RMSD of top-score pose</text><text x="619" y="360" style="font:700 28px Arial;fill:#172033">1.477 Å</text><text x="837" y="325" style="font:16px Arial;fill:#334155">Lowest RMSD</text><text x="837" y="360" style="font:700 28px Arial;fill:#172033">1.316 Å</text><text x="45" y="500" style="font:14px Arial;fill:#172033">These are pose-recovery observations only; they do not estimate affinity, activity, selectivity, safety, or therapeutic effect.</text></svg>
