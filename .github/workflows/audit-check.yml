name: Audit evidence check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile audit scripts
        run: python -m py_compile scripts/fetch_dude_registry.py scripts/audit_dude_receptors.py scripts/render_audit_figures.py scripts/qualify_rcsb_element_mapping.py scripts/render_mapping_figure.py scripts/audit_rcsb_mmcif_preparation.py scripts/merge_rcsb_chunks.py scripts/render_mmcif_figure.py scripts/extract_braf_reference_metadata.py scripts/qualify_braf_sm5_component.py scripts/extract_braf_sm5_reference_instance.py scripts/prepare_braf_chain_a_receptor.py scripts/prepare_braf_sm5_reference_ligand.py scripts/analyze_braf_sm5_pose_recovery.py scripts/summarize_braf_sm5_reference_run.py
      - name: Validate table and regenerate deterministic figures
        run: |
          python scripts/render_audit_figures.py
          python scripts/render_mapping_figure.py
          python scripts/render_mmcif_figure.py
      - name: Verify versioned evidence is current
        run: |
          test -s results/dude_receptor_audit.csv
          test -s reports/figures/figure-1-audit-flow.svg
          test -s reports/figures/figure-2-element-fields.svg
          test -s results/dude_rcsb_element_mapping.csv
          test -s reports/figures/figure-3-authoritative-mapping.svg
          test -s reports/figures/figure-4-mmcif-compatibility.svg
          test -s results/braf_3d4q_reference_metadata.csv
          test -s results/braf_sm5_component_qualification.csv
          test -s results/braf_sm5_chain_a_extraction.csv
          test -s results/braf_chain_a_receptor_preparation.csv
          test -s protocol/braf_3d4q_vina_reference.conf
          test -s results/braf_3d4q_vina_reference_configuration.csv
          test -s results/braf_sm5_reference_ligand_preparation.csv
          test -s results/braf_sm5_reference_pose_recovery.csv
          test -s results/braf_sm5_reference_run.csv
          git diff --exit-code -- reports/figures
